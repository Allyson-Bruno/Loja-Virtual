<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="primefaces">

<ui:composition template="/_template.xhtml">
	<ui:define name="corpo">
		<h:outputScript name="jsf.js" library="javax.faces" target="head"></h:outputScript>
		
		<p:tabView id="tabNota">
		<p:tab title="Dados da Nota">		
		<h:form>
		    <h:messages styleClass="erros" />
			<fieldset>
				<legend>Dados da Nota</legend>
				<h:outputLabel value="CNPJ Cliente:" for="cnpj" />
				<p:inputMask id="cnpj" value="#{notaFiscalMB.notaFiscal.cnpj}" mask="99.999.999/9999-99"/>
				<h:outputLabel value="Data:" />
				
				<h:inputText id="data" type="date" value="#{notaFiscalMB.notaFiscal.data}"
					required="true" requiredMessage="Informe a data da nota fiscal.">
				
				<f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>

				</h:inputText>
				
			</fieldset>
			<h:commandButton value="Gravar" action="#{notaFiscalMB.grava}" />
		</h:form>
		</p:tab>
		<p:tab title="Dados do item">
		<h:form id="item">
		<h:messages styleClass="erros" />
			<fieldset>
				<legend>Dados do item</legend>
				<h:outputLabel value="Produto:" />
				<h:selectOneMenu value="#{notaFiscalMB.idProduto}">
					<f:selectItems value="#{produtoMB.produtos}" var="produto"
						itemValue="#{produto.id}" itemLabel="#{produto.nome}" />
				</h:selectOneMenu>
				<h:outputLabel value="Quantidade:" />
				<h:inputText value="#{notaFiscalMB.itemNota.quantidade}" />
				<p:commandButton action="#{notaFiscalMB.guardaItem}"
					value="Guardar Item"
					process="@form"
					update=":tabNota:listaItens :tabNota:item">
					<!-- f:ajax execute="@form" render=":listaItens :item" /-->
				</p:commandButton>
			</fieldset>
		</h:form>
		<h:form id="listaItens">
			<h2>Itens da nota fiscal</h2>
			<h:dataTable value="#{notaFiscalMB.notaFiscal.itens}" var="item"
				styleClass="dados" rowClasses="impar,par">
				<h:column>
					<f:facet name="header">Produto</f:facet> #{item.produto.nome}
				</h:column>
				<h:column>
					<f:facet name="header">Preço</f:facet>
					<h:outputText value="#{item.valorUnitario}">
						<f:convertNumber type="currency" currencySymbol="R$ "
							locale="pt_BR" />
					</h:outputText>
				</h:column>
				<h:column>
					<f:facet name="header">Quantidade</f:facet>
					#{item.quantidade}
				</h:column>
				<h:column>
					<f:facet name="header">Valor Total</f:facet>
					<h:outputText value="#{item.total}">
						<f:convertNumber type="currency" currencySymbol="R$ "
							locale="pt_BR" />
					</h:outputText>
				</h:column>
			</h:dataTable>
		</h:form>
		</p:tab>
		</p:tabView>
	</ui:define>
</ui:composition>
</html>
