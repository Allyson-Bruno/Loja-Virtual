<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="primefaces">

	<ui:composition template="/_template.xhtml">
	<ui:define name="corpo">	
		<h:form id="cadastro">
		<h2>
			<h:outputText value="Login"/>			
		</h2>
			<fieldset>
				<legend>Dados do Login</legend>
				<h:outputLabel value="Login" for="login" />
				<h:inputText id="login" value="#{usuarioMB.usuario.login}" />
				<h:outputLabel value="Senha" for="senha" /> 
				<h:inputSecret id="senha" value="#{usuarioMB.usuario.senha}" />
				<!-- p:keyboard password="true" value="#{usuarioMB.usuario.senha}" /-->
				<h:commandButton value="Efetuar Login" action="#{usuarioMB.efetuarLogin}">					
				</h:commandButton>
			</fieldset>
		</h:form>
	</ui:define>
	</ui:composition>

</html>
